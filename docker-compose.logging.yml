version: '3.8'

services:
  seq:
    image: datalust/seq:2025.2
    container_name: budgetwise-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=unaPasswordSicura123  # oppure SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped
    networks:
      - budgetwise-network

volumes:
  seq-data:

networks:
  budgetwise-network:
    driver: bridge
